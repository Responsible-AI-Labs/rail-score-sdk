[build-system]
requires = ["setuptools>=45,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rail-score-sdk"
version = "2.6.1"
description = "Evaluate AI-generated content across 8 Responsible AI dimensions — fairness, safety, reliability, transparency, privacy, accountability, inclusivity, user impact"
readme = {file = "PYPI_README.md", content-type = "text/markdown"}
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Sumit Verma", email = "sumit@responsibleailabs.ai"},
    {name = "Responsible AI Labs Team", email = "research@responsibleailabs.ai"},
]
maintainers = [
    {name = "Sumit Verma", email = "sumit@responsibleailabs.ai"},
    {name = "Responsible AI Labs Team", email = "research@responsibleailabs.ai"},
]
keywords = [
    "rail",
    "responsible-ai",
    "ai-safety",
    "ai-ethics",
    "content-evaluation",
    "content-moderation",
    "llm-evaluation",
    "llm-safety",
    "ai-governance",
    "compliance",
    "gdpr",
    "opentelemetry",
    "fairness",
    "transparency",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "requests>=2.28.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=5.0.0",
    "mypy>=0.990",
    "types-requests>=2.28.0",
]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.30"]
google = ["google-genai>=1.0"]
langfuse = ["langfuse>=3.0"]
litellm = ["litellm>=1.40"]
integrations = [
    "openai>=1.0",
    "anthropic>=0.30",
    "google-genai>=1.0",
    "langfuse>=3.0",
    "litellm>=1.40",
]
crewai = ["crewai>=0.30"]
langgraph = ["langgraph>=0.1"]
autogen = ["pyautogen>=0.2"]
agents = [
    "crewai>=0.30",
    "langgraph>=0.1",
    "pyautogen>=0.2",
]
telemetry = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[project.urls]
Homepage = "https://github.com/Responsible-AI-Labs/rail-score-sdk"
Documentation = "https://responsibleailabs.ai/developer/quickstart"
"API Reference" = "https://responsibleailabs.ai/developer/api-reference"
Repository = "https://github.com/Responsible-AI-Labs/rail-score-sdk"
"Bug Reports" = "https://github.com/Responsible-AI-Labs/rail-score-sdk/issues"
Changelog = "https://github.com/Responsible-AI-Labs/rail-score-sdk/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = [
    "rail_score_sdk",
    "rail_score_sdk.integrations",
    "rail_score_sdk.telemetry",
    "rail_score_sdk.agent",
    "rail_score_sdk.agent.integrations",
    "rail_score_sdk.compliance",
    "rail_score_sdk.compliance.dpdp",
]

[tool.setuptools.package-data]
rail_score_sdk = ["py.typed"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=rail_score_sdk",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["rail_score_sdk"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    "venv",
]
